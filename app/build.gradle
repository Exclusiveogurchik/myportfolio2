plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marik.volley'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marik.volley'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
