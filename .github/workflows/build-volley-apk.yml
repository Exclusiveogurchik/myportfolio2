name: Build Volley Coach APK

on:
  push:
    branches: [volley-coach-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare offline body-tracking model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/mediapipe/wasm

          npm pack @mediapipe/tasks-vision@1.0.1 --silent
          tar -xzf mediapipe-tasks-vision-1.0.1.tgz
          cp package/vision_bundle.js app/src/main/assets/mediapipe/vision_bundle.js
          cp package/wasm/vision_wasm_internal.js app/src/main/assets/mediapipe/wasm/
          cp package/wasm/vision_wasm_internal.wasm app/src/main/assets/mediapipe/wasm/
          cp package/wasm/vision_wasm_nosimd_internal.js app/src/main/assets/mediapipe/wasm/
          cp package/wasm/vision_wasm_nosimd_internal.wasm app/src/main/assets/mediapipe/wasm/
          curl -L --fail --retry 3 -o app/src/main/assets/mediapipe/pose_landmarker_full.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: volley-coach-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
